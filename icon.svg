<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0716"/>
      <stop offset="50%" stop-color="#180d2c"/>
      <stop offset="100%" stop-color="#061a23"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff2a85"/>
      <stop offset="100%" stop-color="#ff7b00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect x="20" y="20" width="472" height="472" rx="94" fill="none" stroke="url(#neonCyan)" stroke-width="6" opacity="0.7"/>
  <!-- Steam waves -->
  <path d="M185 180 C165 140, 205 110, 185 70" fill="none" stroke="#00f5d4" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M256 165 C236 125, 276 95, 256 55" fill="none" stroke="#ff2a85" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M327 180 C307 140, 347 110, 327 70" fill="none" stroke="#00f5d4" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Chopsticks -->
  <line x1="120" y1="150" x2="395" y2="210" stroke="#ffbe0b" stroke-width="14" stroke-linecap="round"/>
  <line x1="135" y1="125" x2="395" y2="185" stroke="#fb5607" stroke-width="14" stroke-linecap="round"/>
  <!-- Noodles hanging -->
  <path d="M210 170 Q200 230 220 270 M245 178 Q235 235 255 270 M280 185 Q270 240 290 270" fill="none" stroke="#ffd166" stroke-width="10" stroke-linecap="round"/>
  <!-- Egg & Naruto -->
  <ellipse cx="185" cy="268" rx="38" ry="26" fill="#fff" stroke="#ffd166" stroke-width="6"/>
  <circle cx="185" cy="268" r="14" fill="#ff7b00"/>
  <!-- Bowl -->
  <path d="M86 270 H426 C420 375 345 430 256 430 C167 430 92 375 86 270 Z" fill="#1e1136" stroke="url(#neonPink)" stroke-width="12" filter="url(#glow)"/>
  <path d="M115 315 H397" stroke="#00f5d4" stroke-width="8" stroke-dasharray="28 16" stroke-linecap="round"/>
  <rect x="196" y="425" width="120" height="24" rx="8" fill="#ff2a85"/>
</svg>
